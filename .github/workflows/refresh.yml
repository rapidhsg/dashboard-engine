name: refresh-dashboards

# Builds rr1-data.json / rr2-data.json from the ONE shared source, rr-metrics:
#   data  = rapidhsg/rr-metrics-data, branch "data" (AccuLynx sends, refreshed every 15 min)
#   rules = rapidhsg/rr-metrics-data, branch "main" (locked metric rules)
# This repo no longer calls AccuLynx and holds no metric definitions.

on:
  schedule:
    - cron: "2,17,32,47 * * * *" # every 15 min, a few minutes after each rr-metrics pull
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the rr-metrics rules (main)
        uses: actions/checkout@v4
        with:
          repository: rapidhsg/rr-metrics-data
          ref: main
          path: rrm
          sparse-checkout: rules

      - name: Get the rr-metrics data (data)
        uses: actions/checkout@v4
        with:
          repository: rapidhsg/rr-metrics-data
          ref: data
          path: rrd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas

      - name: Build dashboard data
        env:
          RRM_RULES: rrm/rules
          RRM_DATA: rrd/data
          OUTPUT_DIR: ${{ github.workspace }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python transform/build.py

      - name: Commit refreshed data (only if changed)
        run: |
          git config user.name "dashboard-engine[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rr1-data.json rr2-data.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
